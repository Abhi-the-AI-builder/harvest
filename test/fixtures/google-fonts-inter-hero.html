<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>Google Fonts Inter fidelity</title>
  <!-- Same multi-subset CSS pattern that broke wallofportfolios paste -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet" />
  <style>
    body { margin: 40px; background: #fff; }
    #hero {
      width: 720px;
      box-sizing: border-box;
      padding: 48px 40px;
      font-family: Inter, system-ui, sans-serif;
      text-align: center;
    }
    #hero h1 {
      margin: 0 0 16px;
      font-size: 40px;
      font-weight: 700;
      line-height: 1.15;
      color: #0c1320;
      letter-spacing: -0.02em;
    }
    #hero p {
      margin: 0 0 24px;
      font-size: 16px;
      font-weight: 400;
      line-height: 1.5;
      color: #6b6f77;
    }
    #cta {
      display: inline-flex;
      align-items: center;
      gap: 16px;
      padding: 10px 12px 10px 20px;
      border-radius: 999px;
      background: #f4f5f7;
      border: 1px solid #e6e8ec;
    }
    #cta span {
      font-size: 14px;
      font-weight: 400;
      color: #0c1320;
      white-space: nowrap;
    }
    #cta button {
      border: none;
      border-radius: 999px;
      padding: 10px 18px;
      background: #0c1320;
      color: #fff;
      font-family: inherit;
      font-size: 14px;
      font-weight: 600;
      white-space: nowrap;
      cursor: pointer;
    }
  </style>
</head>
<body>
  <div id="hero">
    <h1>Discover curated work from the world's top designers</h1>
    <p>Explore handpicked portfolios, shipped work &amp; case studies from top designers.</p>
    <div id="cta">
      <span>Showcase your portfolio to designers &amp; recruiters worldwide</span>
      <button type="button">Submit Portfolio</button>
    </div>
  </div>
  <script type="module">
    // Loaded by verify-google-fonts-figma.mjs after injecting Acopio + vendor.
  </script>
</body>
</html>
