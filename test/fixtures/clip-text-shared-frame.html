<!doctype html>
<html><head><meta charset="utf-8"><style>
  body { margin: 0; font-family: sans-serif; }
  #card {
    width: 320px; height: 220px; position: relative;
    overflow: hidden; border-radius: 16px; background: #222;
  }
  #card .bg {
    position: absolute; top: -40px; left: -40px;
    width: 400px; height: 400px; background: radial-gradient(circle, #e74c3c, #922b21);
  }
  #card .caption {
    position: absolute; left: 16px; bottom: 16px; color: #fff; font-size: 20px; font-weight: 700;
  }
</style></head>
<body>
  <div id="card">
    <div class="bg"></div>
    <span class="caption">Overflowing bg must stay clipped</span>
  </div>
</body></html>
