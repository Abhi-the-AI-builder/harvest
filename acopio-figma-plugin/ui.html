<style>
  :root {
    --color-bg: #FAFAFA;
    --color-surface: #FFFFFF;
    --color-text: #17181A;
    --color-text-muted: #6B6E76;
    --color-accent: #1D3461;
    --color-accent-wash: rgba(29, 52, 97, 0.10);
    --color-border: rgba(23, 24, 26, 0.09);
    --color-border-strong: rgba(23, 24, 26, 0.18);
    --color-danger: #C33D2E;
    --color-danger-wash: rgba(195, 61, 46, 0.08);
    --color-success: #1F6B4A;
    --type-color-bg: #F3E8E4;
    --type-font-bg: #E8EEF8;
    --type-image-bg: #E6F2EC;
    --type-component-bg: #FBF0DC;
    --type-note-bg: #E3EEFB;
    --space-1: 4px;
    --space-2: 8px;
    --space-3: 12px;
    --space-4: 16px;
    --space-5: 24px;
    --space-6: 32px;
    --text-caption: 12px;
    --text-body: 14px;
    --text-subheading: 16px;
    --radius-sm: 8px;
    --radius-lg: 16px;
    --radius-full: 999px;
    --shadow-raised: 0 2px 6px rgba(23, 24, 26, 0.08), 0 8px 20px rgba(23, 24, 26, 0.10);
    --ease-fast: 120ms ease-out;
    --ease-base: 180ms cubic-bezier(.2, .7, .3, 1);
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    font-family: Inter, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    font-size: var(--text-body);
    color: var(--color-text);
    background: var(--color-bg);
    display: flex;
    flex-direction: column;
    height: 100vh;
  }

  .content {
    flex: 1;
    display: flex;
    flex-direction: column;
    padding: var(--space-4);
    gap: var(--space-4);
    overflow-y: auto;
  }

  .brand {
    display: flex;
    flex-direction: row;
    align-items: center;
    gap: var(--space-3);
  }

  .brand-logo {
    width: 40px;
    height: 40px;
    border-radius: 10px;
    flex: none;
    object-fit: cover;
    box-shadow: var(--shadow-raised);
    background: #000;
  }

  .brand-copy {
    display: flex;
    flex-direction: column;
    gap: var(--space-1);
    min-width: 0;
  }

  h1 {
    font-size: var(--text-subheading);
    font-weight: 700;
    line-height: 1.3;
  }

  .subtitle {
    font-size: var(--text-caption);
    color: var(--color-text-muted);
    line-height: 1.5;
  }

  /* Orbit hero — shape-of-things empty/idle illustration */
  .orbit-stage {
    position: relative;
    width: 100%;
    height: 208px;
    border-radius: var(--radius-lg);
    border: 1px solid var(--color-border);
    background: var(--color-surface);
    overflow: hidden;
    flex: none;
  }

  .orbit-stage[hidden] { display: none !important; }

  .orbit-ring {
    position: absolute;
    left: 50%;
    top: 50%;
    border: 1px dashed rgba(23, 24, 26, 0.12);
    border-radius: 50%;
    transform: translate(-50%, -50%);
    pointer-events: none;
  }
  /* Outer ring must stay under stage height with padding — previously 176 in 168 clipped. */
  .orbit-ring-a { width: 64px; height: 64px; }
  .orbit-ring-b { width: 104px; height: 104px; }
  .orbit-ring-c { width: 144px; height: 144px; opacity: 0.7; }

  .orbit-core {
    position: absolute;
    left: 50%;
    top: 50%;
    width: 44px;
    height: 44px;
    margin: -22px 0 0 -22px;
    border-radius: 12px;
    background: #000;
    display: flex;
    align-items: center;
    justify-content: center;
    box-shadow: var(--shadow-raised);
    z-index: 2;
    overflow: hidden;
  }
  .orbit-core img {
    width: 100%;
    height: 100%;
    object-fit: cover;
    display: block;
  }

  .orbit-chip {
    position: absolute;
    width: 28px;
    height: 28px;
    border-radius: 8px;
    display: flex;
    align-items: center;
    justify-content: center;
    border: 1px solid var(--color-border);
    box-shadow: 0 1px 2px rgba(23, 24, 26, 0.06);
    z-index: 1;
    color: var(--color-text);
  }
  .orbit-chip svg { width: 14px; height: 14px; }
  .orbit-chip-color { background: var(--type-color-bg); left: 18%; top: 20%; }
  .orbit-chip-font { background: var(--type-font-bg); right: 16%; top: 18%; }
  .orbit-chip-image { background: var(--type-image-bg); left: 14%; bottom: 22%; }
  .orbit-chip-component { background: var(--type-component-bg); right: 14%; bottom: 20%; }
  .orbit-chip-note { background: var(--type-note-bg); left: 44%; bottom: 14%; }

  .welcome-card {
    background: var(--color-surface);
    border: 1px solid var(--color-border);
    border-radius: var(--radius-lg);
    padding: var(--space-4);
    display: flex;
    flex-direction: column;
    gap: var(--space-2);
    box-shadow: var(--shadow-raised);
  }
  .welcome-card[hidden] { display: none !important; }

  .welcome-eyebrow {
    font-size: var(--text-caption);
    font-weight: 600;
    color: var(--color-accent);
  }
  .welcome-title {
    font-size: var(--text-body);
    font-weight: 700;
    line-height: 1.35;
  }
  .welcome-body {
    font-size: var(--text-caption);
    line-height: 1.55;
    color: var(--color-text-muted);
  }

  .hint {
    font-size: var(--text-caption);
    line-height: 1.45;
    color: var(--color-text-muted);
  }

  .actions {
    display: flex;
    flex-direction: column;
    gap: var(--space-2);
    margin-top: auto;
    padding-top: var(--space-4);
  }

  .actions .hint {
    margin-bottom: var(--space-1);
  }

  #status:empty {
    display: none;
  }

  .paste-zone {
    display: none;
    flex-direction: column;
    gap: var(--space-2);
    margin-top: var(--space-1);
  }
  .paste-zone.is-open {
    display: flex;
  }
  .paste-zone textarea {
    width: 100%;
    min-height: 72px;
    resize: vertical;
    border: 1px solid var(--color-border-strong);
    border-radius: var(--radius-sm);
    padding: var(--space-3);
    font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
    font-size: 11px;
    line-height: 1.4;
    color: var(--color-text);
    background: var(--color-surface);
  }
  .paste-zone textarea:focus {
    outline: 2px solid var(--color-accent-wash);
    border-color: var(--color-accent);
  }
  .paste-zone-hint {
    font-size: var(--text-caption);
    color: var(--color-text-muted);
    line-height: 1.45;
  }

  button {
    font-family: inherit;
    font-size: var(--text-caption);
    font-weight: 600;
    border: none;
    border-radius: var(--radius-sm);
    padding: var(--space-3) var(--space-4);
    cursor: pointer;
    transition: background var(--ease-fast), color var(--ease-fast), border-color var(--ease-fast), filter var(--ease-fast);
  }
  button:disabled { opacity: 0.45; cursor: default; }

  .btn-primary {
    background: var(--color-accent);
    color: #fff;
    width: 100%;
  }
  .btn-primary:not(:disabled):hover { filter: brightness(1.08); }

  .btn-secondary {
    background: var(--color-surface);
    color: var(--color-text);
    border: 1px solid var(--color-border-strong);
    width: 100%;
  }
  .btn-secondary:not(:disabled):hover {
    background: var(--color-accent-wash);
    border-color: var(--color-accent);
    color: var(--color-accent);
  }

  #status {
    font-size: var(--text-caption);
    color: var(--color-text-muted);
    min-height: 16px;
    line-height: 1.45;
  }
  #status.success { color: var(--color-success); }
  #status.error {
    color: var(--color-danger);
    background: var(--color-danger-wash);
    border-radius: var(--radius-sm);
    padding: var(--space-2) var(--space-3);
  }
</style>

<script>
  const importBtn = document.getElementById("import-btn");
  const pasteBtn = document.getElementById("paste-btn");
  const pasteZone = document.getElementById("paste-zone");
  const pasteInput = document.getElementById("paste-input");
  const statusEl = document.getElementById("status");
  const welcomeEl = document.getElementById("acopio-welcome");
  const welcomeTitleEl = document.getElementById("welcome-title");
  const welcomeBodyEl = document.getElementById("welcome-body");
  const orbitStage = document.getElementById("orbit-stage");

  const SUPPORTED_VERSIONS = [1, 2];
  let importing = false;
  let awaitingPaste = false;
  let savedPairKey = null;
  let pendingImportAfterPairKey = false;

  function setStatus(text, kind) {
    statusEl.textContent = text || "";
    statusEl.className = kind || "";
  }

  function setOrbitVisible(visible) {
    orbitStage.hidden = !visible;
  }

  function openPasteZone(message) {
    pasteZone.hidden = false;
    pasteZone.removeAttribute("hidden");
    pasteZone.classList.add("is-open");
    if (message) setStatus(message, "error");
    setOrbitVisible(true);
    pasteInput.focus();
    pasteInput.select();
  }

  function closePasteZone() {
    awaitingPaste = false;
    pasteZone.hidden = true;
    pasteZone.setAttribute("hidden", "");
    pasteZone.classList.remove("is-open");
    pasteInput.value = "";
  }

  function beginAwaitingPaste(message) {
    awaitingPaste = true;
    openPasteZone(
      message ||
        "Paste backup: press ⌘V / Ctrl+V once, or paste your Acopio link code."
    );
    importBtn.textContent = "Waiting for ⌘V…";
  }

  function validatePayload(payload) {
    if (!payload || typeof payload !== "object") {
      return "Clipboard doesn't contain an Acopio export.";
    }
    if (!SUPPORTED_VERSIONS.includes(payload.version)) {
      return `Unsupported export version (${payload.version ?? "missing"}).`;
    }
    if (!Array.isArray(payload.items) || payload.items.length === 0) {
      return "Export has no items to import.";
    }
    return null;
  }

  function siteCountFor(items) {
    return new Set(items.map((item) => (item && item.hostname) || "unknown")).size;
  }

  function showWelcomeForPayload(payload, { autoImporting } = {}) {
    const count = payload.items.length;
    const sites = siteCountFor(payload.items);
    const siteNote = sites > 1 ? ` from ${sites} sites` : "";
    const scope = payload.scopeLabel ? ` · ${payload.scopeLabel}` : "";
    welcomeTitleEl.textContent = `${count} item${count === 1 ? "" : "s"}${siteNote}${scope}`;
    if (autoImporting) {
      welcomeBodyEl.textContent = "Importing now…";
      setOrbitVisible(false);
    } else {
      welcomeBodyEl.textContent = "Export found. Importing onto this page.";
      setOrbitVisible(true);
    }
    welcomeEl.hidden = false;
  }

  function setBusy(busy, label) {
    importing = busy;
    importBtn.disabled = busy;
    pasteBtn.disabled = busy;
    pasteInput.disabled = busy;
    if (label) setStatus(label);
  }

  function extractPairKeyFromText(text) {
    const raw = String(text || "").trim();
    const m = raw.match(/ACOPIO_FIGMA_PAIR:([a-zA-Z0-9]+)/);
    if (m) return m[1];
    try {
      const payload = JSON.parse(raw.includes("\n") ? raw.slice(raw.indexOf("{")) : raw);
      if (payload && payload.pairKey) return String(payload.pairKey);
    } catch (_) {}
    if (/^[a-zA-Z0-9]{8,32}$/.test(raw)) return raw;
    return null;
  }

  function sendImport(payload) {
    awaitingPaste = false;
    closePasteZone();
    clearError();
    setBusy(true, "Importing…");
    setOrbitVisible(false);
    importBtn.textContent = "Import from Acopio";
    if (payload && payload.pairKey) {
      savedPairKey = String(payload.pairKey);
      parent.postMessage({ pluginMessage: { type: "set-pair-key", pairKey: savedPairKey } }, "*");
    }
    parent.postMessage({ pluginMessage: { type: "import-payload", payload } }, "*");
  }

  function requestHandoffImport(pairKey) {
    clearError();
    setBusy(true, "Fetching export…");
    importBtn.textContent = "Fetching…";
    parent.postMessage(
      { pluginMessage: { type: "import-from-handoff", pairKey: pairKey || savedPairKey || null } },
      "*"
    );
  }

  function importFromText(text, { fromPasteZone } = {}) {
    if (!text || !String(text).trim()) {
      showError("Paste was empty. Export to Figma in Acopio, then try Import again.");
      beginAwaitingPaste();
      return false;
    }
    const pairFromText = extractPairKeyFromText(text);
    if (pairFromText) {
      savedPairKey = pairFromText;
      parent.postMessage({ pluginMessage: { type: "set-pair-key", pairKey: pairFromText } }, "*");
      // If the paste is only a link code (or code + JSON), prefer cloud fetch.
      const jsonStart = String(text).indexOf("{");
      if (jsonStart < 0) {
        requestHandoffImport(pairFromText);
        return true;
      }
    }
    let payload;
    try {
      const raw = String(text);
      const jsonStart = raw.indexOf("{");
      payload = JSON.parse(jsonStart >= 0 ? raw.slice(jsonStart) : raw);
    } catch (_) {
      if (pairFromText) {
        requestHandoffImport(pairFromText);
        return true;
      }
      showError("That isn’t Acopio JSON. Export again, or paste your link code.");
      beginAwaitingPaste();
      return false;
    }
    const err = validatePayload(payload);
    if (err) {
      showError(err);
      beginAwaitingPaste();
      return false;
    }
    showWelcomeForPayload(payload, { autoImporting: false });
    sendImport(payload);
    return true;
  }

  async function tryClipboardThenLink() {
    // Tertiary only — Figma usually denies this.
    try {
      const text = await navigator.clipboard.readText();
      const pair = extractPairKeyFromText(text);
      if (pair) {
        savedPairKey = pair;
        parent.postMessage({ pluginMessage: { type: "set-pair-key", pairKey: pair } }, "*");
        requestHandoffImport(pair);
        return;
      }
      if (text && text.trim()) {
        importFromText(text, { fromPasteZone: false });
        return;
      }
    } catch (_) {
      // expected
    }
    setBusy(false);
    importBtn.textContent = "Import from Acopio";
    beginAwaitingPaste(
      "Link once: paste the code from Acopio’s Finish in Figma modal. After that, Import is one click."
    );
  }

  async function importFromClipboard(source) {
    if (importing) return;
    clearError();
    if (source === "paste") {
      beginAwaitingPaste("Backup: press ⌘V, or paste your Acopio link code / export JSON.");
      return;
    }
    // Primary: fetch by pair key (no clipboard).
    if (savedPairKey) {
      requestHandoffImport(savedPairKey);
      return;
    }
    // Ask main thread for a previously saved key, then fetch or link.
    pendingImportAfterPairKey = true;
    setBusy(true, "Checking link…");
    importBtn.textContent = "Checking…";
    parent.postMessage({ pluginMessage: { type: "get-pair-key" } }, "*");
  }

  function showError(message) {
    setStatus(message, "error");
  }

  function clearError() {
    setStatus("");
  }

  function handlePasteEvent(e) {
    if (importing) return;
    const text = e.clipboardData && e.clipboardData.getData("text");
    if (!text) return;
    if (!awaitingPaste && e.target !== pasteInput) return;
    e.preventDefault();
    pasteInput.value = text;
    importFromText(text, { fromPasteZone: true });
  }

  importBtn.addEventListener("click", () => importFromClipboard("import"));
  pasteBtn.addEventListener("click", () => importFromClipboard("paste"));
  window.addEventListener("paste", handlePasteEvent);
  pasteInput.addEventListener("keydown", (e) => {
    if (e.key === "Enter" && (e.metaKey || e.ctrlKey)) {
      e.preventDefault();
      importFromText(pasteInput.value, { fromPasteZone: true });
    }
  });

  window.onmessage = (event) => {
    const msg = event.data.pluginMessage;
    if (!msg) return;
    if (msg.type === "plugin-ready") {
      if (msg.pairKey) savedPairKey = msg.pairKey;
    } else if (msg.type === "pair-key") {
      savedPairKey = msg.pairKey || null;
      if (pendingImportAfterPairKey) {
        pendingImportAfterPairKey = false;
        if (savedPairKey) {
          requestHandoffImport(savedPairKey);
        } else {
          tryClipboardThenLink();
        }
        return;
      }
      // User just pasted / saved a link code while waiting — fetch.
      if (savedPairKey && awaitingPaste && !importing) {
        requestHandoffImport(savedPairKey);
      }
    } else if (msg.type === "need-pair-key") {
      pendingImportAfterPairKey = false;
      setBusy(false);
      importBtn.textContent = "Import from Acopio";
      beginAwaitingPaste(
        "Paste the link code shown in Acopio after Export (one-time). Then Import works with one click."
      );
    } else if (msg.type === "progress") {
      setStatus(`Importing ${msg.done} / ${msg.total}…`);
    } else if (msg.type === "import-complete") {
      setBusy(false);
      awaitingPaste = false;
      importBtn.textContent = "Import from Acopio";
      const skipped = msg.failed ? ` (${msg.failed} skipped)` : "";
      setStatus(`Imported ${msg.imported} item${msg.imported === 1 ? "" : "s"}${skipped}.`, "success");
      welcomeBodyEl.textContent = `Imported ${msg.imported} item${msg.imported === 1 ? "" : "s"} onto this page.`;
      welcomeEl.hidden = false;
      setOrbitVisible(false);
      closePasteZone();
    } else if (msg.type === "import-error") {
      setBusy(false);
      importBtn.textContent = "Import from Acopio";
      showError(msg.message || "Import failed.");
      setOrbitVisible(true);
      beginAwaitingPaste(
        "Couldn't fetch export. Export again in Acopio, or paste JSON / link code here."
      );
    }
  };
</script>
