<style>
  :root {
    --bg: #ffffff;
    --surface: #f5f5f5;
    --border: #e5e5e5;
    --text: #1a1a1a;
    --text-muted: #737373;
    --accent: #18a0fb;
    --accent-hover: #0d8fe8;
    --success: #0fa958;
    --error: #f24822;
    --error-bg: #fef0ee;
    --radius-sm: 8px;
    --radius-md: 16px;
  }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    font-size: 12px;
    color: var(--text);
    background: var(--bg);
    display: flex;
    flex-direction: column;
    height: 100vh;
  }

  .content {
    flex: 1;
    display: flex;
    flex-direction: column;
    padding: 16px;
    gap: 12px;
    overflow-y: auto;
  }

  h1 {
    font-size: 14px;
    font-weight: 600;
    margin: 0;
  }

  .subtitle {
    font-size: 11px;
    color: var(--text-muted);
    margin: 0;
    line-height: 1.5;
  }

  .welcome-card {
    background: #17181a;
    color: #ffffff;
    border-radius: var(--radius-md);
    padding: 16px;
    display: flex;
    flex-direction: column;
    gap: 8px;
    box-shadow: 0 8px 24px rgba(0, 0, 0, 0.18);
  }

  .welcome-card[hidden] { display: none !important; }

  .welcome-eyebrow {
    margin: 0;
    font-size: 11px;
    font-weight: 600;
    letter-spacing: 0.02em;
    color: rgba(255, 255, 255, 0.72);
  }

  .welcome-title {
    margin: 0;
    font-size: 16px;
    font-weight: 600;
    line-height: 1.3;
  }

  .welcome-body {
    margin: 0;
    font-size: 11px;
    line-height: 1.55;
    color: rgba(255, 255, 255, 0.88);
  }

  button {
    font-family: inherit;
    font-size: 12px;
    font-weight: 600;
    border: none;
    border-radius: var(--radius-sm);
    padding: 10px 14px;
    cursor: pointer;
    transition: background 120ms ease-out, border-color 120ms ease-out;
  }

  button:disabled {
    opacity: 0.5;
    cursor: not-allowed;
  }

  .btn-primary {
    background: var(--accent);
    color: #fff;
    width: 100%;
  }
  .btn-primary:not(:disabled):hover { background: var(--accent-hover); }

  .btn-secondary {
    background: var(--surface);
    color: var(--text);
    border: 1px solid var(--border);
    width: 100%;
  }
  .btn-secondary:not(:disabled):hover {
    border-color: var(--accent);
    color: var(--accent);
  }

  #status {
    font-size: 11px;
    color: var(--text-muted);
    min-height: 16px;
    line-height: 1.4;
  }
  #status.success { color: var(--success); }
  #status.error { color: var(--error); }

  .footer {
    border-top: 1px solid var(--border);
    padding: 12px 16px;
  }

  .btn-ghost {
    background: transparent;
    color: var(--text-muted);
    width: 100%;
  }
</style>

<div class="content">
  <div id="acopio-welcome" class="welcome-card" hidden>
    <p class="welcome-eyebrow">Opened from Acopio</p>
    <p class="welcome-title" id="welcome-title">Export ready</p>
    <p class="welcome-body" id="welcome-body"></p>
  </div>

  <div>
    <h1>Acopio Import</h1>
    <p class="subtitle">Import items copied from the Acopio Chrome extension. Each item becomes a frame with its preview and note.</p>
  </div>

  <button class="btn-primary" id="import-btn" type="button">Import from Acopio</button>
  <button class="btn-secondary" id="paste-btn" type="button">Paste from clipboard</button>

  <div id="status" role="status" aria-live="polite"></div>
</div>

<div class="footer">
  <button class="btn-ghost" id="close-btn" type="button">Close</button>
</div>

<script>
  const importBtn = document.getElementById("import-btn");
  const pasteBtn = document.getElementById("paste-btn");
  const closeBtn = document.getElementById("close-btn");
  const statusEl = document.getElementById("status");
  const welcomeEl = document.getElementById("acopio-welcome");
  const welcomeTitleEl = document.getElementById("welcome-title");
  const welcomeBodyEl = document.getElementById("welcome-body");

  const SUPPORTED_VERSIONS = [1, 2];
  let importing = false;
  let autoImportAttempted = false;

  function setStatus(text, kind) {
    statusEl.textContent = text || "";
    statusEl.className = kind || "";
  }

  function validatePayload(payload) {
    if (!payload || typeof payload !== "object") {
      return "Clipboard doesn't contain a Acopio export.";
    }
    if (!SUPPORTED_VERSIONS.includes(payload.version)) {
      return `Unsupported export version (${payload.version ?? "missing"}).`;
    }
    if (!Array.isArray(payload.items) || payload.items.length === 0) {
      return "Export has no items to import.";
    }
    return null;
  }

  function siteCountFor(items) {
    return new Set(items.map((item) => (item && item.hostname) || "unknown")).size;
  }

  function showWelcomeForPayload(payload, { autoImporting } = {}) {
    const count = payload.items.length;
    const sites = siteCountFor(payload.items);
    const siteNote = sites > 1 ? ` from ${sites} sites` : "";
    const scope = payload.scopeLabel ? ` (${payload.scopeLabel})` : "";
    welcomeTitleEl.textContent = `${count} item${count === 1 ? "" : "s"}${siteNote}${scope}`;
    if (autoImporting) {
      welcomeBodyEl.textContent =
        "Importing from your clipboard now. First time here? Install this plugin once via Plugins → Development → Import plugin from manifest — choose acopio-figma-plugin/manifest.json in the Acopio repo.";
    } else if (payload.openedFromExtension || payload.autoImport) {
      welcomeBodyEl.textContent =
        "Acopio copied your export and opened Figma. Run this plugin once (Plugins → Development → Acopio Import, or ⌘⌥P on Mac). It reads the clipboard automatically — or click Import from Acopio below. First time? Import the plugin from acopio-figma-plugin/manifest.json.";
    } else {
      welcomeBodyEl.textContent =
        "Acopio export found on your clipboard. Click Import from Acopio, or Paste from clipboard if you copied again in the extension.";
    }
    welcomeEl.hidden = false;
  }

  function setBusy(busy, label) {
    importing = busy;
    importBtn.disabled = busy;
    pasteBtn.disabled = busy;
    if (label) setStatus(label);
  }

  async function readClipboardText() {
    return navigator.clipboard.readText();
  }

  function sendImport(payload) {
    setBusy(true, "Importing…");
    parent.postMessage({ pluginMessage: { type: "import-payload", payload } }, "*");
  }

  async function importFromClipboard(source) {
    if (importing) return;
    clearError();
    const idleImport = importBtn.textContent;
    const idlePaste = pasteBtn.textContent;
    if (source === "paste") {
      pasteBtn.disabled = true;
      pasteBtn.textContent = "Reading clipboard…";
    } else {
      importBtn.disabled = true;
      importBtn.textContent = "Reading clipboard…";
    }
    try {
      const text = await readClipboardText();
      if (!text || !text.trim()) {
        showError("Clipboard is empty. In Acopio, use Export to Figma first.");
        return;
      }
      let payload;
      try {
        payload = JSON.parse(text);
      } catch (_) {
        showError("Clipboard doesn't contain valid Acopio JSON.");
        return;
      }
      const err = validatePayload(payload);
      if (err) {
        showError(err);
        return;
      }
      showWelcomeForPayload(payload, { autoImporting: false });
      sendImport(payload);
    } catch (_) {
      showError("Couldn't read clipboard. Click Paste from clipboard after copying in Acopio.");
    } finally {
      importBtn.disabled = importing;
      pasteBtn.disabled = importing;
      importBtn.textContent = idleImport;
      pasteBtn.textContent = idlePaste;
    }
  }

  function showError(message) {
    setStatus(message, "error");
  }

  function clearError() {
    setStatus("");
  }

  async function tryAutoImport() {
    if (autoImportAttempted || importing) return;
    autoImportAttempted = true;
    try {
      const text = await readClipboardText();
      if (!text || !text.trim()) return;
      let payload;
      try {
        payload = JSON.parse(text);
      } catch (_) {
        return;
      }
      if (!payload.autoImport && !payload.openedFromExtension) return;
      const err = validatePayload(payload);
      if (err) return;
      showWelcomeForPayload(payload, { autoImporting: Boolean(payload.autoImport) });
      if (payload.autoImport) {
        sendImport(payload);
      }
    } catch (_) {
      // Clipboard denied or empty — user can click Import manually.
    }
  }

  importBtn.addEventListener("click", () => importFromClipboard("import"));
  pasteBtn.addEventListener("click", () => importFromClipboard("paste"));
  closeBtn.addEventListener("click", () => {
    parent.postMessage({ pluginMessage: { type: "cancel" } }, "*");
  });

  window.onmessage = (event) => {
    const msg = event.data.pluginMessage;
    if (!msg) return;
    if (msg.type === "plugin-ready") {
      tryAutoImport();
    } else if (msg.type === "progress") {
      setStatus(`Importing ${msg.done} / ${msg.total}…`);
    } else if (msg.type === "import-complete") {
      setBusy(false);
      const skipped = msg.failed ? ` (${msg.failed} skipped)` : "";
      setStatus(`Imported ${msg.imported} item${msg.imported === 1 ? "" : "s"}${skipped}.`, "success");
      welcomeBodyEl.textContent = `Imported ${msg.imported} item${msg.imported === 1 ? "" : "s"} onto this page.`;
      closeBtn.textContent = "Close";
    } else if (msg.type === "import-error") {
      setBusy(false);
      showError(msg.message || "Import failed.");
    }
  };
</script>
